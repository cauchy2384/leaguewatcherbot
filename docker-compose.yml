version: '3.8'

services:
  leaguewatcher:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - leaguewatcher:latest
    image: leaguewatcher:latest
    container_name: leaguewatcher-bot

    # Auto-restart on crashes
    restart: unless-stopped

    # Required environment variables (from .env file)
    environment:
      - BOT_DISCORD_TOKEN=${BOT_DISCORD_TOKEN}
      - BOT_OWNER_ID=${BOT_OWNER_ID}
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # FlareSolverr proxy for Cloudflare challenge passing
      - FLARESOLVERR_URL=http://flaresolverr:8191

    # Depends on flaresolverr to ensure it starts first
    depends_on:
      - flaresolverr

    # Volume strategy:
    # - Named volume for entire /app directory (persistence for pidors.json, log.json)
    volumes:
      # Persistent data volume
      - leaguewatcher-data:/app

    # Resource limits (prevent runaway usage)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Log rotation to prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FlareSolverr — Cloudflare challenge solver
  # Solves Cloudflare Turnstile CAPTCHA that blocks Mobalytics API
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# Named volume for data persistence
volumes:
  leaguewatcher-data:
    driver: local
