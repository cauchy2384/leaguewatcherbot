version: '3.8'

services:
  leaguewatcher:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - leaguewatcher:latest
    image: leaguewatcher:latest
    container_name: leaguewatcher-bot

    # Auto-restart on crashes
    restart: unless-stopped

    # Required environment variables (from .env file)
    environment:
      - BOT_DISCORD_TOKEN=${BOT_DISCORD_TOKEN}
      - BOT_OWNER_ID=${BOT_OWNER_ID}
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # FlareSolverr proxy for Cloudflare challenge passing
      - FLARESOLVERR_URL=http://flaresolverr:8191

    # Wait for flaresolverr to be READY (API listening on 8191), not just
    # started: plain `depends_on` only guarantees service_started.
    depends_on:
      flaresolverr:
        condition: service_healthy

    # Volume strategy:
    # - Named volume for entire /app directory (persistence for pidors.json, log.json)
    volumes:
      # Persistent data volume
      - leaguewatcher-data:/app

    # Resource limits (prevent runaway usage)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Log rotation to prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FlareSolverr — Cloudflare challenge solver
  # Solves Cloudflare Turnstile CAPTCHA that blocks Mobalytics API
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    # Readiness probe: the image is Node-based, so `node` is available
    # inside the container. The probe TCP-connects to the API port (8191)
    # from the container's own loopback. The bot's depends_on
    # (condition: service_healthy) gates the bot's start on this probe.
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('net'),s=n.connect(8191,'127.0.0.1'),t=setTimeout(()=>process.exit(1),3000);s.on('connect',()=>{clearTimeout(t);process.exit(0)});s.on('error',()=>{clearTimeout(t);process.exit(1)};"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# Named volume for data persistence
volumes:
  leaguewatcher-data:
    driver: local
