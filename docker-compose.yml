services:
  leaguewatcher:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - leaguewatcher:latest
    image: leaguewatcher:latest
    container_name: leaguewatcher-bot

    # Auto-restart on crashes
    restart: unless-stopped

    # Required environment variables (from .env file)
    # BOT_DISCORD_TOKEN / BOT_OWNER_ID / config come from Doppler via DOPPLER_TOKEN
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # FlareSolverr proxy for Cloudflare challenge passing
      - FLARESOLVERR_URL=http://flaresolverr:8191

    # Start after flaresolverr container is up. No healthcheck gate:
    # FlareSolverr's official compose has none, and node-based probes
    # in this image have been unreliable. Extra sleep covers Chromium boot.
    depends_on:
      - flaresolverr

    entrypoint: ["/bin/sh", "-c", "sleep 30 && exec /app/leaguewatcherbot"]

    # Bind-mount persistent game/audit data from host ./data
    volumes:
      - ./data/pidors.json:/app/pidors.json
      - ./data/log.json:/app/log.json

    # Resource limits (prevent runaway usage)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Log rotation to prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FlareSolverr — Cloudflare challenge solver
  # Solves Cloudflare Turnstile CAPTCHA that blocks Mobalytics API
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Moscow
    # Chromium needs shared memory; default 64MB often crashes the browser
    shm_size: "2gb"
    # Optional: uncomment to debug from the host (ss/curl localhost:8191)
    # ports:
    #   - "8191:8191"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
